    <!-- Route third-party chat estimate buttons to the same on-site calendar. -->
    <script>
      (function() {
        var TARGET = 'book an estimate';
        function openCalendar() {
          if (typeof window.openEstimateCalendar === 'function') window.openEstimateCalendar();
          else { window.dataLayer = window.dataLayer || []; window.dataLayer.push({event: 'cal_booking_opened'}); window.open('https://cal.com/legacyindustrialcoatings/on-site-estimate', '_blank', 'noopener,noreferrer'); }
        }

        function matches(el) {
          if (!el || el.nodeType !== 1) return false;
          var txt = (el.innerText || el.textContent || '').trim().toLowerCase();
          return txt === TARGET;
        }

        // Recursively walk light + shadow DOM
        function walk(root, hits) {
          var nodes;
          try { nodes = root.querySelectorAll('*'); } catch (e) { return; }
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (matches(el) && !el.dataset.hijacked) hits.push(el);
            if (el.shadowRoot) walk(el.shadowRoot, hits);
          }
        }

        function attach() {
          var hits = [];
          walk(document, hits);
          hits.forEach(function(btn) {
            btn.dataset.hijacked = 'true';
            btn.addEventListener('click', function(e) {
              e.stopPropagation();
              e.preventDefault();
              openCalendar();
            }, true);
          });
        }

        // Capture-phase delegation as a backup — works even when target is inside shadow DOM
        document.addEventListener('click', function(e) {
          var path = (typeof e.composedPath === 'function') ? e.composedPath() : [];
          for (var i = 0; i < path.length; i++) {
            if (matches(path[i])) {
              e.stopPropagation();
              e.preventDefault();
              openCalendar();
              return;
            }
          }
        }, true);

        var observer = new MutationObserver(attach);
        observer.observe(document.documentElement, { childList: true, subtree: true });

        document.addEventListener('DOMContentLoaded', attach);
        setTimeout(attach, 2000);
        setTimeout(attach, 5000);
      })();
    </script>
